<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Atkinson Hyperlegible, system-ui, -apple-system, Segoe UI, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Negative Auswirkungen von Fixierungen</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6e69"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dfe8e4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9db0a9" stroke-width="1"/></pattern><clipPath id="brainclip"><path d="M70,190 C60,110 150,50 270,45 C400,40 520,90 535,170 C545,220 520,255 470,262 C440,266 420,252 398,252 L340,254 C300,292 232,300 192,286 C150,272 118,262 98,245 C80,232 72,212 70,190 Z"/></clipPath></defs><rect width="600" height="380" fill="#ffffff"/><g transform="translate(0,0)"><circle cx="300" cy="190" r="70" fill="#cbd8d3" stroke="#9db0a9" stroke-width="2"/><text x="300" y="186" font-size="14" font-weight="800" fill="#5b6e69" text-anchor="middle">Fixierung</text><text x="300" y="204" font-size="10.5" fill="#5b6e69" text-anchor="middle">„Schutz“?</text><rect x="210" y="14" width="180" height="50" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.3"/><text x="300" y="35" font-size="11.5" font-weight="700" fill="#5b6e69" text-anchor="middle">psychischer Stress,</text><text x="300" y="52" font-size="11.5" fill="#5b6e69" text-anchor="middle">Angst, Depression</text><rect x="415" y="94" width="180" height="50" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.3"/><text x="505" y="115" font-size="11.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Verletzungen durch Gurte,</text><text x="505" y="132" font-size="11.5" fill="#5b6e69" text-anchor="middle">Sturz, Strangulation</text><rect x="415" y="244" width="180" height="50" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.3"/><text x="505" y="265" font-size="11.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Dekubitus, Kontrakturen,</text><text x="505" y="282" font-size="11.5" fill="#5b6e69" text-anchor="middle">Pneumonie, Thrombose</text><rect x="210" y="319" width="180" height="50" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.3"/><text x="300" y="340" font-size="11.5" font-weight="700" fill="#5b6e69" text-anchor="middle">mehr Unruhe →</text><text x="300" y="357" font-size="11.5" fill="#5b6e69" text-anchor="middle">mehr Medikamente</text><rect x="5" y="244" width="180" height="50" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.3"/><text x="95" y="265" font-size="11.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Abhängigkeit,</text><text x="95" y="282" font-size="11.5" fill="#5b6e69" text-anchor="middle">Resignation, Rückzug</text><rect x="5" y="94" width="180" height="50" rx="8" fill="#d6e4f5" stroke="#2f6db3" stroke-width="3"/><text x="95" y="128" font-size="20" font-weight="800" fill="#2f6db3" text-anchor="middle">?</text><line x1="300" y1="118" x2="300" y2="68" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="360" y1="160" x2="412" y2="135" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="360" y1="222" x2="412" y2="252" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="262" x2="300" y2="318" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="240" y1="222" x2="188" y2="252" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="240" y1="160" x2="188" y2="135" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/></g><circle cx="575" cy="365" r="13" fill="#2f6db3"/><text x="575" y="370" font-size="15" fill="#ffffff" text-anch