<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" font-family="Atkinson Hyperlegible, system-ui, -apple-system, Segoe UI, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Teufelskreis des Helfersyndroms</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6e69"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dfe8e4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9db0a9" stroke-width="1"/></pattern><clipPath id="brainclip"><path d="M70,190 C60,110 150,50 270,45 C400,40 520,90 535,170 C545,220 520,255 470,262 C440,266 420,252 398,252 L340,254 C300,292 232,300 192,286 C150,272 118,262 98,245 C80,232 72,212 70,190 Z"/></clipPath></defs><rect width="600" height="360" fill="#ffffff"/><g transform="translate(0,0)"><rect x="195.0" y="27.0" width="210" height="56" rx="8" fill="#dfe8e4" stroke="#9db0a9" stroke-width="1.5"/><text x="300.0" y="53.0" font-size="12" font-weight="700" fill="#5b6e69" text-anchor="middle">schwaches Selbstwertgefühl</text><text x="300.0" y="70.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">„Nur wer hilft, ist wertvoll“</text><rect x="386.6378880334735" y="116.82779073125684" width="210" height="56" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="491.6378880334735" y="142.82779073125684" font-size="12" font-weight="700" fill="#5b6e69" text-anchor="middle">übersteigertes Helfen</text><text x="491.6378880334735" y="159.82779073125684" font-size="10.5" fill="#5b6e69" text-anchor="middle">ungefragt, kann nicht Nein sagen</text><rect x="313.4387283369333" y="262.1722092687432" width="210" height="56" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="418.4387283369333" y="288.1722092687432" font-size="12" font-weight="700" fill="#5b6e69" text-anchor="middle">Wunsch nach Dank</text><text x="418.4387283369333" y="305.1722092687432" font-size="10.5" fill="#5b6e69" text-anchor="middle">Anerkennung als „Lohn“</text><rect x="76.56127166306669" y="262.1722092687432" width="210" height="56" rx="8" fill="#d6e4f5" stroke="#2f6db3" stroke-width="3"/><text x="181.5612716630667" y="298.1722092687432" font-size="22" font-weight="700" fill="#2f6db3" text-anchor="middle">?</text><rect x="3.362111966526527" y="116.82779073125687" width="210" height="56" rx="8" fill="#dfe8e4" stroke="#9db0a9" stroke-width="1.5"/><text x="108.36211196652653" y="142.82779073125687" font-size="12" font-weight="700" fill="#5b6e69" text-anchor="middle">noch mehr Aufopferung</text><text x="108.36211196652653" y="159.82779073125687" font-size="10.5" fill="#5b6e69" text-anchor="middle">oder Frust, Bitterkeit, Vorwürfe</text><path d="M361,84 L430,116" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><path d="M468,191 L442,244" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><path d="M343,290 L257,290" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><path d="M158,244 L132,191" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><path d="M170,116 L239,84" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/></g><circle cx="560" cy="40" r="13" fill="#2f6db3"/><text x="560" y="45" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">?</text></svg>