<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 385" width="600" height="385" font-family="Atkinson Hyperlegible, system-ui, -apple-system, Segoe UI, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Stadien der suizidalen Entwicklung</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6e69"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dfe8e4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9db0a9" stroke-width="1"/></pattern><clipPath id="brainclip"><path d="M70,190 C60,110 150,50 270,45 C400,40 520,90 535,170 C545,220 520,255 470,262 C440,266 420,252 398,252 L340,254 C300,292 232,300 192,286 C150,272 118,262 98,245 C80,232 72,212 70,190 Z"/></clipPath></defs><rect width="600" height="385" fill="#ffffff"/><g transform="translate(0,0)"><rect x="20" y="10" width="180" height="340" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.2"/><text x="110" y="36" font-size="15" font-weight="800" fill="#5b6e69" text-anchor="middle">Erwägung</text><text x="110" y="262" font-size="11.5" fill="#5b6e69" text-anchor="middle">sozialer Rückzug</text><text x="110" y="279" font-size="11.5" fill="#5b6e69" text-anchor="middle">selektive Wahrnehmung</text><text x="110" y="296" font-size="11.5" fill="#5b6e69" text-anchor="middle">von Suiziden im Umfeld</text><rect x="210" y="10" width="180" height="340" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.2"/><text x="300" y="36" font-size="15" font-weight="800" fill="#5b6e69" text-anchor="middle">Ambivalenz</text><text x="300" y="262" font-size="11.5" fill="#5b6e69" text-anchor="middle">direkte Ankündigungen</text><text x="300" y="279" font-size="11.5" fill="#5b6e69" text-anchor="middle">→ Hilferufe,</text><text x="300" y="296" font-size="11.5" fill="#5b6e69" text-anchor="middle">Kontaktversuche</text><rect x="400" y="10" width="180" height="340" rx="8" fill="#d6e4f5" stroke="#2f6db3" stroke-width="3"/><text x="490" y="40" font-size="22" font-weight="800" fill="#2f6db3" text-anchor="middle">?</text><text x="490" y="262" font-size="11.5" fill="#5b6e69" text-anchor="middle">indirekte Ankündigungen</text><text x="490" y="279" font-size="11.5" fill="#5b6e69" text-anchor="middle">(z. B. Abschied, Testament)</text><text x="490" y="296" font-size="11.5" fill="#5b6e69" text-anchor="middle">„Ruhe vor dem Sturm“</text><path d="M40,70 L150,165 L185,135 L215,180 L240,110 L270,170 L300,105 L330,165 L370,120 L430,150 L470,165" fill="none" stroke="#5b6e69" stroke-width="3" stroke-linejoin="round"/><circle cx="520" cy="170" r="44" fill="#cbd8d3" stroke="#9db0a9" stroke-width="2"/><text x="520" y="166" font-size="11.5" font-weight="700" fill="#5b6e69" text-anchor="middle">suizidale</text><text x="520" y="181" font-size="11.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Handlung</text></g><circle cx="575" cy="368" r="13" fill="#2f6db3"/><text x="575" y="373" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">?</text></svg>