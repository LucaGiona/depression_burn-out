<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="Atkinson Hyperlegible, system-ui, -apple-system, Segoe UI, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Besondere Sicherungsmaßnahmen nach § 39 PsychKG Berlin</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6e69"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dfe8e4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9db0a9" stroke-width="1"/></pattern><clipPath id="brainclip"><path d="M70,190 C60,110 150,50 270,45 C400,40 520,90 535,170 C545,220 520,255 470,262 C440,266 420,252 398,252 L340,254 C300,292 232,300 192,286 C150,272 118,262 98,245 C80,232 72,212 70,190 Z"/></clipPath></defs><rect width="600" height="300" fill="#ffffff"/><g transform="translate(0,0)"><rect x="15" y="10" width="135" height="110" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="82.5" y="56.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Aufenthalt im Freien</text><text x="82.5" y="73.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">beschränken</text><text x="82.5" y="87.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">oder verbieten</text><rect x="160" y="10" width="135" height="110" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="227.5" y="56.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Gegenstände</text><text x="227.5" y="73.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">wegnehmen</text><text x="227.5" y="87.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">oder vorenthalten</text><rect x="305" y="10" width="135" height="110" rx="8" fill="#d6e4f5" stroke="#2f6db3" stroke-width="3"/><text x="372.5" y="73.0" font-size="22" font-weight="700" fill="#2f6db3" text-anchor="middle">?</text><rect x="450" y="10" width="135" height="110" rx="8" fill="#cbd8d3" stroke="#9db0a9" stroke-width="1.5"/><text x="517.5" y="56.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Fixierung</text><text x="517.5" y="73.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">mechanisch, ggf. mit</text><text x="517.5" y="87.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">ärztlicher Sedierung</text><rect x="15" y="150" width="570" height="120" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="300.0" y="194.0" font-size="13" font-weight="700" fill="#5b6e69" text-anchor="middle">Bedingungen</text><text x="300.0" y="211.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">nur als letztes Mittel – Gefahr nicht anders abwendbar · ärztlich angeordnet und befristet</text><text x="300.0" y="225.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">aufheben, sobald Gründe entfallen · engmaschig überwachen, bei Fixierung ständige</text><text x="300.0" y="239.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">persönliche Begleitung (1:1) · lückenlos dokumentieren · Vertretung/Angehörige benachrichtigen</text><line x1="300" y1="122" x2="300" y2="148" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/></g><circle cx="575" cy="285" r="13" fill="#2f6db3"/><text x="575" y="290" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">?</text></svg>