<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Atkinson Hyperlegible, system-ui, -apple-system, Segoe UI, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Wer muss einer freiheitsbeschränkenden Maßnahme zustimmen?</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6e69"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dfe8e4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9db0a9" stroke-width="1"/></pattern><clipPath id="brainclip"><path d="M70,190 C60,110 150,50 270,45 C400,40 520,90 535,170 C545,220 520,255 470,262 C440,266 420,252 398,252 L340,254 C300,292 232,300 192,286 C150,272 118,262 98,245 C80,232 72,212 70,190 Z"/></clipPath></defs><rect width="600" height="400" fill="#ffffff"/><g transform="translate(0,0)"><rect x="160" y="8" width="280" height="48" rx="8" fill="#cbd8d3" stroke="#9db0a9" stroke-width="1.5"/><text x="300.0" y="37.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Ist die Person einwilligungsfähig?</text><rect x="20" y="96" width="230" height="62" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="135.0" y="125.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Einwilligung der Person</text><text x="135.0" y="142.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">sie entscheidet selbst</text><rect x="350" y="96" width="230" height="62" rx="8" fill="#d6e4f5" stroke="#2f6db3" stroke-width="3"/><text x="465.0" y="135.0" font-size="22" font-weight="700" fill="#2f6db3" text-anchor="middle">?</text><line x1="230" y1="56" x2="150" y2="94" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="370" y1="56" x2="450" y2="94" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="200" width="165" height="150" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="332.5" y="245.0" font-size="12" font-weight="700" fill="#5b6e69" text-anchor="middle">Vertretung da</text><text x="332.5" y="262.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">+ Genehmigung des</text><text x="332.5" y="276.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">Betreuungsgerichts,</text><text x="332.5" y="290.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">wenn die Maßnahme</text><text x="332.5" y="304.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">dauerhaft oder</text><text x="332.5" y="318.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">regelmäßig ist</text><rect x="425" y="200" width="165" height="150" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="507.5" y="245.0" font-size="12" font-weight="700" fill="#5b6e69" text-anchor="middle">keine Vertretung</text><text x="507.5" y="262.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">Notfall: mutmaßliche</text><text x="507.5" y="276.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">Einwilligung · Eilent-</text><text x="507.5" y="290.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">scheidung des Gerichts ·</text><text x="507.5" y="304.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">(vorläufige) Betreuung</text><text x="507.5" y="318.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">anregen</text><line x1="430" y1="158" x2="335" y2="198" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="500" y1="158" x2="505" y2="198" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/></g><circle cx="575" cy="385" r="13" fill="#2f6db3"/><text x="575" y="390" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">?</text></svg>