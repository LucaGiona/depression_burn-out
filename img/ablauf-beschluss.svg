<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Atkinson Hyperlegible, system-ui, -apple-system, Segoe UI, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Ablauf einer Unterbringung nach PsychKG</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6e69"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dfe8e4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9db0a9" stroke-width="1"/></pattern><clipPath id="brainclip"><path d="M70,190 C60,110 150,50 270,45 C400,40 520,90 535,170 C545,220 520,255 470,262 C440,266 420,252 398,252 L340,254 C300,292 232,300 192,286 C150,272 118,262 98,245 C80,232 72,212 70,190 Z"/></clipPath></defs><rect width="600" height="400" fill="#ffffff"/><g transform="translate(0,0)"><rect x="150" y="8" width="300" height="52" rx="8" fill="#cbd8d3" stroke="#9db0a9" stroke-width="1.5"/><text x="300.0" y="32.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">akute Selbst- oder Fremdgefährdung</text><text x="300.0" y="49.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">freiwillige Behandlung abgelehnt</text><rect x="20" y="92" width="260" height="86" rx="8" fill="#dfe8e4" stroke="#9db0a9" stroke-width="1.5"/><text x="150.0" y="119.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">vorläufige Unterbringung</text><text x="150.0" y="136.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">ohne Gericht, längstens bis zum</text><text x="150.0" y="150.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">Ende des folgenden Tages</text><text x="150.0" y="164.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">durch SpDi, Polizei oder Klinik</text><rect x="320" y="92" width="260" height="86" rx="8" fill="#dfe8e4" stroke="#9db0a9" stroke-width="1.5"/><text x="450.0" y="126.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Antrag beim Amtsgericht</text><text x="450.0" y="143.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">schriftlich durch den</text><text x="450.0" y="157.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">Sozialpsychiatrischen Dienst</text><line x1="260" y1="60" x2="170" y2="90" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="340" y1="60" x2="430" y2="90" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="135" x2="318" y2="135" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="214" width="180" height="62" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="110.0" y="243.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">1  Facharzt der Klinik</text><text x="110.0" y="260.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">begutachtet</text><rect x="210" y="214" width="180" height="62" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="300.0" y="243.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">2  Facharzt des SpDi</text><text x="300.0" y="260.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">unabhängiges Gutachten</text><line x1="200" y1="245" x2="208" y2="245" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="214" width="180" height="62" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="490.0" y="243.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">3  Richter*in</text><text x="490.0" y="260.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">hört an, beschließt</text><line x1="390" y1="245" x2="398" y2="245" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="450" y1="178" x2="300" y2="210" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><rect x="140" y="312" width="320" height="62" rx="8" fill="#d6e4f5" stroke="#2f6db3" stroke-width="3"/><text x="300.0" y="351.0" font-size="22" font-weight="700" fill="#2f6db3" text-anchor="middle">?</text><line x1="300" y1="276" x2="300" y2="310" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/></g><circle cx="575" cy="385" r="13" fill="#2f6db3"/><text x="575" y="390" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">?</text></svg>