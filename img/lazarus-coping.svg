<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Atkinson Hyperlegible, system-ui, -apple-system, Segoe UI, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Transaktionales Stressmodell nach Lazarus</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6e69"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dfe8e4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9db0a9" stroke-width="1"/></pattern><clipPath id="brainclip"><path d="M70,190 C60,110 150,50 270,45 C400,40 520,90 535,170 C545,220 520,255 470,262 C440,266 420,252 398,252 L340,254 C300,292 232,300 192,286 C150,272 118,262 98,245 C80,232 72,212 70,190 Z"/></clipPath></defs><rect width="600" height="400" fill="#ffffff"/><g transform="translate(0,0)"><rect x="200" y="10" width="200" height="52" rx="8" fill="#dfe8e4" stroke="#9db0a9" stroke-width="1.5"/><text x="300.0" y="34.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Stressor</text><text x="300.0" y="51.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">z. B. Prüfung, Lärm, Konflikt</text><rect x="20" y="100" width="260" height="82" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="150.0" y="125.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Primäre Bewertung</text><text x="150.0" y="142.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">„Was bedeutet das für mich?“</text><text x="150.0" y="156.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">irrelevant · günstig · stressend</text><text x="150.0" y="170.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">(Schaden, Bedrohung, Herausforderung)</text><rect x="320" y="100" width="260" height="82" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="450.0" y="125.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Sekundäre Bewertung</text><text x="450.0" y="142.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">„Kann ich das bewältigen?“</text><text x="450.0" y="156.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">eigene Ressourcen: Fähigkeiten,</text><text x="450.0" y="170.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">Unterstützung, Zutrauen</text><rect x="200" y="215" width="200" height="50" rx="8" fill="#cbd8d3" stroke="#9db0a9" stroke-width="1.5"/><text x="300.0" y="238.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Stressreaktion</text><text x="300.0" y="255.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">wenn Anforderung > Ressourcen</text><rect x="20" y="300" width="260" height="70" rx="8" fill="#d6e4f5" stroke="#2f6db3" stroke-width="3"/><text x="150.0" y="343.0" font-size="22" font-weight="700" fill="#2f6db3" text-anchor="middle">?</text><rect x="320" y="300" width="260" height="70" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="450.0" y="326.0" font-size="12.5" font-weight="700" fill="#5b6e69" text-anchor="middle">Neubewertung</text><text x="450.0" y="343.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">„Was lerne ich daraus?“</text><text x="450.0" y="357.0" font-size="10.5" fill="#5b6e69" text-anchor="middle">Bedrohung ↔ Herausforderung</text><line x1="260" y1="62" x2="160" y2="98" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="340" y1="62" x2="440" y2="98" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="282" y1="141" x2="318" y2="141" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><line x1="150" y1="184" x2="240" y2="213" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="450" y1="184" x2="360" y2="213" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="250" y1="267" x2="160" y2="298" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><line x1="282" y1="335" x2="318" y2="335" stroke="#5b6e69" stroke-width="2" marker-end="url(#a)"/><path d="M582,335 C598,335 598,40 402,36" fill="none" stroke="#5b6e69" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/></g><circle cx="575" cy="385" r="13" fill="#2f6db3"/><text x="575" y="390" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">?</text></svg>