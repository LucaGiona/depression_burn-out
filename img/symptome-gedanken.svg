" fill="#5b6e69">Niedergeschlagenheit, Leere</text><text x="326" y="78" font-size="12" fill="#5b6e69">„Gefühl der Gefühllosigkeit“</text><text x="326" y="96" font-size="12" fill="#5b6e69">Hoffnungslosigkeit, Angst</text><text x="326" y="114" font-size="12" fill="#5b6e69">Wertlosigkeit, Gereiztheit</text><rect x="20" y="170" width="270" height="148" rx="10" fill="#dfe8e4" stroke="#9db0a9" stroke-width="1.5"/><text x="36" y="196" font-size="14" font-weight="700" fill="#5b6e69">Körper</text><text x="36" y="220" font-size="12" fill="#5b6e69">Schlafstörungen, Appetitverlust</text><text x="36" y="238" font-size="12" fill="#5b6e69">Schmerzen (Rücken, Kopf)</text><text x="36" y="256" font-size="12" fill="#5b6e69">Engegefühl, Verdauung</text><text x="36" y="274" font-size="12" fill="#5b6e69">innere Unruhe</text><rect x="310" y="170" width="270" height="148" rx="10" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.5"/><text x="326" y="196" font-size="14" font-weight="700" fill="#5b6e69">Verhalten</text><text x="326" y="220" font-size="12" fill="#5b6e69">Antriebslosigkeit (Morgentief)</text><text x="326" y="238" font-size="12" fill="#5b6e69">sozialer Rückzug</text><text x="326" y="256" font-size="12" fill="#5b6e69">Interessenverlust</text><text x="326" y="274" font-size="12" fill="#5b6e69">verlangsamte Bewegungen</text></g><circle cx="300" cy="165" r="13" fill="#2f6db3"/><text x="300" y="170" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">?</text></svg>