<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="Atkinson Hyperlegible, system-ui, -apple-system, Segoe UI, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Ebenen der Suizidprävention nach WHO</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6e69"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#dfe8e4"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9db0a9" stroke-width="1"/></pattern><clipPath id="brainclip"><path d="M70,190 C60,110 150,50 270,45 C400,40 520,90 535,170 C545,220 520,255 470,262 C440,266 420,252 398,252 L340,254 C300,292 232,300 192,286 C150,272 118,262 98,245 C80,232 72,212 70,190 Z"/></clipPath></defs><rect width="600" height="300" fill="#ffffff"/><g transform="translate(0,0)"><rect x="165" y="20" width="270" height="84" rx="8" fill="#d6e4f5" stroke="#2f6db3" stroke-width="3"/><text x="300.0" y="48" font-size="20" font-weight="800" fill="#2f6db3" text-anchor="middle">?</text><text x="300.0" y="66" font-size="10.8" fill="#5b6e69" text-anchor="middle">einzelne gefährdete Menschen:</text><text x="300.0" y="81" font-size="10.8" fill="#5b6e69" text-anchor="middle">Nachsorge nach Entlassung, Schulung</text><text x="300.0" y="96" font-size="10.8" fill="#5b6e69" text-anchor="middle">von Fachpersonal, Behandlung</text><rect x="130" y="110" width="340" height="84" rx="8" fill="#dfe8e4" stroke="#9db0a9" stroke-width="1.4"/><text x="300.0" y="134" font-size="13.5" font-weight="800" fill="#5b6e69" text-anchor="middle">selektiv</text><text x="300.0" y="156" font-size="10.8" fill="#5b6e69" text-anchor="middle">Risikogruppen: Trauma, Flucht, Hinterbliebene</text><text x="300.0" y="171" font-size="10.8" fill="#5b6e69" text-anchor="middle">nach Suizid – Beratungsstellen, Multiplikatoren</text><rect x="40" y="200" width="520" height="84" rx="8" fill="#eef3f1" stroke="#9db0a9" stroke-width="1.4"/><text x="300.0" y="224" font-size="13.5" font-weight="800" fill="#5b6e69" text-anchor="middle">universell</text><text x="300.0" y="246" font-size="10.8" fill="#5b6e69" text-anchor="middle">gesamte Bevölkerung: Zugang zu Versorgung, psychische Gesundheit</text><text x="300.0" y="261" font-size="10.8" fill="#5b6e69" text-anchor="middle">fördern, Alkohol reduzieren, Zugang zu Mitteln begrenzen, Medien</text></g><circle cx="560" cy="40" r="13" fill="#2f6db3"/><text x="560" y="45" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">?</text></svg>